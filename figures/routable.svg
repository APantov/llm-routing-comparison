<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">What there is to route: the cheap rung against the top rung</title>
<desc id="d">measured on real models  |  n=209 held-out tasks per ladder · every task falls in exactly one cell. A router can only ever convert the blue cell. Grey either way is denominator: both rungs agree, so no routing decision changes the outcome. Discordant pairs — blue plus amber — are what a routing benchmark should be sized by, not its task count (RESULTS §2.2).</desc>
<style>@media (prefers-color-scheme:dark){.f-paper{fill:#0f1216}.f-ink{fill:#e9ecef}.f-muted{fill:#a8b0b8}.f-faint{fill:#8b939b}.f-grid{fill:#2a3038}.f-wash{fill:#1b2027}.f-base{fill:#98a1aa}.s-ink{stroke:#e9ecef}.s-muted{stroke:#a8b0b8}.s-faint{stroke:#8b939b}.s-grid{stroke:#333b45}.s-base{stroke:#98a1aa}.s-paper{stroke:#0f1216}}</style>
