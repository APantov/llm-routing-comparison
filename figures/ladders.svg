<title id="t">Cascade against always paying for the best model</title>
<desc id="d">measured on real models  |  n=209 held-out tasks per ladder · both panels share their rows, so each ladder is one line across the figure. Dots, not bars: the accuracy axis starts at 80%, so a bar drawn from it would encode the deepseek ladder's 2.9-point gain as a bar 77% longer. Cost is what serving the same 209 tasks cost, scaled to 1,000 queries. The arrow runs from always-expensive to the cascade.</desc>
