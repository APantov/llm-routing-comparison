<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Cost-quality frontier on the `wide` ladder: policies are curves, not points</title>
<desc id="d">measured on real models  |  v4-flash → opus-5 · n=209 held-out tasks · every policy swept across its whole knob range. Up and to the left is better. The bold line is each family's achievable frontier (upper hull); the faint marks behind it are the individual settings, including the ones a mix of two others beats. Comparing two routers at one setting each lets whoever set the knobs pick the winner, which is why this sweeps them instead.</desc>
