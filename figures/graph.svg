<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The router that ships: classify → answer → verify → escalate ⟲</title>
<desc id="d">parsed from router_agent/graph.py — 5 nodes, 8 edges, read with `ast` rather than drawn from memory. The loop is the product. `verify` decides whether the cheap answer stands; only a failed verification spends money on the next rung, and `escalate` can refuse on budget, approval or top-of-ladder. Every dollar figure this graph reports comes from the same price table and response cache as the benchmark tables, which is what makes the two comparable.</desc>
