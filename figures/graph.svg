<text x="713.6" y="268.0" text-anchor="start" font-size="9" fill="#666666" class="f-muted">interrupt() suspends here</text>
<text x="56.0" y="377.0" text-anchor="start" font-size="10" fill="#d55e00">the cycle — `escalate` bumps the rung and re-enters `answer`, which is what makes this a cascade rather than a router</text>
