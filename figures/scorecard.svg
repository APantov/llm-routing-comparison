<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">What each policy did with its escalations</title>
<desc id="d">measured on real models  |  wide ladder, n=209 held-out tasks · every escalation is joined against what the two rungs could actually do. Shorter is better: every unit of bar is a task got wrong, or an escalation paid for that could not have improved the answer. `always_expensive` burns $0.711 on escalations that could not improve the answer, to buy 27 rescues. `cascade` gets 24 of them and wastes 8x less, because verification tells it which escalations are worth making.</desc>
<style>@media (prefers-color-scheme:dark){.f-paper{fill:#0f1216}.f-ink{fill:#e9ecef}.f-muted{fill:#a8b0b8}.f-faint{fill:#8b939b}.f-grid{fill:#2a3038}.f-wash{fill:#1b2027}.f-base{fill:#98a1aa}.s-ink{stroke:#e9ecef}.s-muted{stroke:#a8b0b8}.s-faint{stroke:#8b939b}.s-grid{stroke:#333b45}.s-base{stroke:#98a1aa}.s-paper{stroke:#0f1216}}</style>
