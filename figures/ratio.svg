<text x="150.5" y="338.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted" font-style="italic" transform="rotate(-90 150.5 338.0)">rule of thumb: cascade above ~3x</text>
<path d="M 161.4 154.8 L 285.3 122.6 L 615.4 312.2" fill="none" stroke="#8a8a8a" class="s-faint" stroke-width="1.4" stroke-dasharray="6,4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="161.4" cy="154.8" r="7.0" fill="#009e73"/>
<text x="175.4" y="148.8" text-anchor="start" font-size="11" fill="#009e73" font-weight="bold">deepseek  -4.4%</text>
<text x="219.1" y="163.2" text-anchor="middle" font-size="9" fill="#666666" class="f-muted">3.11x · v4-flash → v4-pro</text>
<circle cx="285.3" cy="122.6" r="7.0" fill="#d55e00"/>
<text x="299.3" y="116.6" text-anchor="start" font-size="11" fill="#d55e00" font-weight="bold">claude  +11.7%</text>
<text x="338.6" y="131.0" text-anchor="middle" font-size="9" fill="#666666" class="f-muted">6.50x · haiku-4-5 → sonnet-5 → opus-5</text>
<circle cx="615.4" cy="312.2" r="7.0" fill="#0072b2"/>
<text x="615.4" y="282.2" text-anchor="middle" font-size="11" fill="#0072b2" font-weight="bold">wide  -83.1%</text>
<text x="615.4" y="296.6" text-anchor="middle" font-size="9" fill="#666666" class="f-muted">46.43x · v4-flash → opus-5</text>
<text x="391.0" y="382.0" text-anchor="middle" font-size="12" fill="#222222" class="f-ink">effective price ratio, top rung over bottom  (log scale)</text>
<text x="56.0" y="221.0" text-anchor="middle" font-size="12" fill="#222222" class="f-ink" transform="rotate(-90 56.0 221.0)">cascade cost vs always-best, at matched accuracy</text>
<text x="690.0" y="112.0" text-anchor="start" font-size="11" fill="#222222" class="f-ink" font-weight="bold">Why a threshold fails</text>
<text x="690.0" y="132.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">A rule of the form “cascade when the ratio</text>
<text x="690.0" y="146.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">exceeds τ” must put every ladder above τ</text>
<text x="690.0" y="160.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">on the same side of zero.</text>
<text x="690.0" y="178.0" text-anchor="start" font-size="9.5" fill="#222222" class="f-ink">These 3 do not sort that way, so no τ gets</text>
<text x="690.0" y="192.0" text-anchor="start" font-size="9.5" fill="#222222" class="f-ink">more than two of the three right.</text>
<text x="26" y="461" font-size="10" fill="#8a8a8a" class="f-faint">Read down the x axis: cheap ladder cascades, middle ladder does not, dear ladder cascades. No threshold on this axis separates those, which is what non-monotonic means.</text>
<text x="26" y="474" font-size="10" fill="#8a8a8a" class="f-faint">What decides it instead is what verification costs on that ladder, and how much better the top rung actually is (RESULTS §2.5).</text>
</svg>