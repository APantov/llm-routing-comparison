<line x1="155.5" y1="96.0" x2="155.5" y2="346.0" stroke="#dddddd" class="s-grid" stroke-width="1.0"/>
<text x="155.5" y="362.0" text-anchor="middle" font-size="11" fill="#222222" class="f-ink">3x</text>
<line x1="241.2" y1="96.0" x2="241.2" y2="346.0" stroke="#dddddd" class="s-grid" stroke-width="1.0"/>
<text x="241.2" y="362.0" text-anchor="middle" font-size="11" fill="#222222" class="f-ink">5x</text>
<line x1="357.6" y1="96.0" x2="357.6" y2="346.0" stroke="#dddddd" class="s-grid" stroke-width="1.0"/>
<text x="357.6" y="362.0" text-anchor="middle" font-size="11" fill="#222222" class="f-ink">10x</text>
<line x1="474.0" y1="96.0" x2="474.0" y2="346.0" stroke="#dddddd" class="s-grid" stroke-width="1.0"/>
<text x="474.0" y="362.0" text-anchor="middle" font-size="11" fill="#222222" class="f-ink">20x</text>
<line x1="627.9" y1="96.0" x2="627.9" y2="346.0" stroke="#dddddd" class="s-grid" stroke-width="1.0"/>
<text x="627.9" y="362.0" text-anchor="middle" font-size="11" fill="#222222" class="f-ink">50x</text>
<rect x="118.0" y="96.0" width="546.0" height="250.0" fill="none" stroke="#222222" class="s-ink"/>
<line x1="118.0" y1="146.0" x2="664.0" y2="146.0" stroke="#222222" class="s-ink" stroke-width="1.5"/>
<text x="165.5" y="334.0" text-anchor="start" font-size="10" fill="#1c7a4a" font-weight="bold">cascade is CHEAPER at matched accuracy</text>
<text x="654.0" y="114.0" text-anchor="end" font-size="10" fill="#a8461a" font-weight="bold">cascade is DEARER at matched accuracy</text>
