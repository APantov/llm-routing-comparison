<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The price ratio does not decide whether to cascade</title>
<desc id="d">measured on real models  |  each ladder's own frontier run, n=209 held-out tasks. Read down the x axis: cheap ladder cascades, middle ladder does not, dear ladder cascades. No threshold on this axis separates those, which is what non-monotonic means. What decides it instead is what verification costs on that ladder, and how much better the top rung actually is (RESULTS §2.5).</desc>
<style>@media (prefers-color-scheme:dark){.f-paper{fill:#0f1216}.f-ink{fill:#e9ecef}.f-muted{fill:#a8b0b8}.f-faint{fill:#8b939b}.f-grid{fill:#2a3038}.f-wash{fill:#1b2027}.f-base{fill:#98a1aa}.s-ink{stroke:#e9ecef}.s-muted{stroke:#a8b0b8}.s-faint{stroke:#8b939b}.s-grid{stroke:#333b45}.s-base{stroke:#98a1aa}.s-paper{stroke:#0f1216}}</style>
