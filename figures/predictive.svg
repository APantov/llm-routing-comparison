<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 556" width="920" height="556" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Predictive routing does not beat a coin flip</title>
<desc id="d">measured on real models  |  exact McNemar over paired outcomes, n=209 held-out tasks per ladder. `random_matched` flips a coin at the LLM router's own escalation rate, so the comparison holds spend roughly fixed and isolates skill rather than budget. The distinction is when the decision is made: a predictive router commits before seeing an attempt, a cascade decides after verifying one (RESULTS §2.3).</desc>
<style>@media (prefers-color-scheme:dark){.f-paper{fill:#0f1216}.f-ink{fill:#e9ecef}.f-muted{fill:#a8b0b8}.f-faint{fill:#8b939b}.f-grid{fill:#2a3038}.f-wash{fill:#1b2027}.f-base{fill:#98a1aa}.s-ink{stroke:#e9ecef}.s-muted{stroke:#a8b0b8}.s-faint{stroke:#8b939b}.s-grid{stroke:#333b45}.s-base{stroke:#98a1aa}.s-paper{stroke:#0f1216}}</style>
<rect width="920" height="556" fill="#ffffff" class="f-paper"/>
<text x="26" y="26" font-size="15" font-weight="bold" fill="#222222" class="f-ink">Predictive routing does not beat a coin flip</text>
<text x="26" y="43" font-size="11" fill="#666666" class="f-muted">measured on real models  |  exact McNemar over paired outcomes, n=209 held-out tasks per ladder</text>
<text x="277.5" y="89.0" text-anchor="start" font-size="12" fill="#222222" class="f-ink" font-weight="bold">Is the difference detectable at all?</text>
