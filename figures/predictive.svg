<text x="634.2" y="506.0" text-anchor="start" font-size="10.5" fill="#222222" class="f-ink">routellm AUC</text>
<rect x="722.6" y="497.0" width="22.0" height="10.0" fill="#0072b2"/>
<text x="752.6" y="506.0" text-anchor="start" font-size="10.5" fill="#222222" class="f-ink">cascade AUC</text>
<text x="26" y="531" font-size="10" fill="#8a8a8a" class="f-faint">`random_matched` flips a coin at the LLM router's own escalation rate, so the comparison holds spend roughly fixed and isolates skill rather than budget.</text>
<text x="26" y="544" font-size="10" fill="#8a8a8a" class="f-faint">The distinction is when the decision is made: a predictive router commits before seeing an attempt, a cascade decides after verifying one (RESULTS §2.3).</text>
</svg>