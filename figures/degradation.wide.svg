<text x="690.0" y="101.0" text-anchor="start" font-size="10" fill="#666666" class="f-muted" font-weight="bold">measured</text>
<line x1="690.0" y1="116.0" x2="712.0" y2="116.0" stroke="#0072b2" stroke-width="2.5"/>
<text x="720.0" y="120.0" text-anchor="start" font-size="11" fill="#222222" class="f-ink">accuracy</text>
<line x1="690.0" y1="134.0" x2="712.0" y2="134.0" stroke="#d55e00" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="720.0" y="138.0" text-anchor="start" font-size="11" fill="#222222" class="f-ink">escalation rate</text>
<line x1="690.0" y1="152.0" x2="712.0" y2="152.0" stroke="#cc79a7" stroke-width="2.5"/>
<text x="720.0" y="156.0" text-anchor="start" font-size="11" fill="#222222" class="f-ink">cost</text>
<text x="690.0" y="372.0" text-anchor="start" font-size="11" fill="#222222" class="f-ink" font-weight="bold">The trap</text>
<text x="690.0" y="392.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">A cascade with a worthless verifier still</text>
<text x="690.0" y="406.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">looks good on cost per correct answer: at</text>
<text x="690.0" y="420.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">p=1.00 a coin flip sends half the traffic to</text>
<text x="690.0" y="434.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">the cheap rung and saves money doing it.</text>
<text x="690.0" y="448.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">Only the accuracy-matched comparison</text>
<text x="690.0" y="462.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">separates a good verifier from no verifier,</text>
<text x="690.0" y="476.0" text-anchor="start" font-size="9.5" fill="#666666" class="f-muted">and the sweep prints both.</text>
<text x="26" y="595" font-size="10" fill="#8a8a8a" class="f-faint">p is the probability the verifier ignores the test result and guesses. p=0 is a perfect verifier; p=1 is a coin flip.</text>
<text x="26" y="608" font-size="10" fill="#8a8a8a" class="f-faint">No cliff: there is no threshold below which verifier quality stops mattering, so it has to be budgeted for rather than assumed (RESULTS §2.8).</text>
