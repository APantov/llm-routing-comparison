<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The experiment: cascade quality and cost against verifier quality</title>
<desc id="d">measured on real models  |  wide ladder, 357 code tasks, seed 0 · models, prompts, grader and tasks all held fixed. p is the probability the verifier ignores the test result and guesses. p=0 is a perfect verifier; p=1 is a coin flip. No cliff: there is no threshold below which verifier quality stops mattering, so it has to be budgeted for rather than assumed (RESULTS §2.8).</desc>
