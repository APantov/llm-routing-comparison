[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-routing"
version = "0.2.0"
description = "A cost-aware LLM routing service, and the benchmark that decides its policy"
readme = "README.md"
# 3.10 or newer, and the version matters more than usual here:
# llm_routing.graders.grade_run_asserts runs candidate code with [sys.executable, path],
# so the code grader's verdict depends on which interpreter launched the
# evaluation. Pin it, and record which one produced any quoted result.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Asen" }]
keywords = ["llm", "routing", "cascade", "langgraph", "mcp", "evaluation"]

# NOTHING HERE BY DEFAULT, AND THAT IS THE POINT.
#
# The research core (llm_routing/) is pure standard library in mock mode.
# A bare `pip install .` must not change that: the whole reproducibility claim
# is that anyone can clone this repo, run it on a bare interpreter with no
# network and no key, and get the same numbers byte for byte.
#
# Every dependency below is therefore optional and named for the one thing it
# unlocks.
#
#     python -m venv .venv && . .venv/bin/activate   # Windows: .venv\Scripts\activate
#     pip install -e ".[all]"                        # everything that cannot spend money
#     pip install -e ".[real]"                       # add the API SDK
#
# DELIBERATELY ABSENT, and each for a reason:
#
#   openai   pulled in only by RouteLLM's `mf` variant, which this project does
#            not use. `bert` is the variant chosen precisely because it runs
#            locally with no key - see llm_routing/routellm_router.py for the
#            full table.
#   scipy    llm_routing/stats.py implements exact McNemar and a paired
#            bootstrap directly. An exact test on a 2x2 table is a few lines; a
#            dependency that large should buy more than that.
#   matplotlib  llm_routing/plot.py writes SVG from the standard library. The
#            figures are byte-deterministic as a result, which matplotlib's
#            would not be.
dependencies = []

[project.optional-dependencies]
# The LangGraph routing engine (router_agent.graph). Needed to serve a query.
agent = ["langgraph>=1.2,<2"]

# The MCP server, so any MCP client can call the router as a tool.
mcp = ["mcp>=2.0,<3"]

# Real mode: calling Anthropic and DeepSeek. Both go through the Anthropic SDK,
# because DeepSeek is reached via its Anthropic-format endpoint.
real = ["anthropic==0.120.2"]

# Grading the MBPP+ code half. Every expanded evalplus test program opens with
# `import numpy as np` and compares floats with np.allclose.
code = ["numpy>=2.0"]

dev = ["pytest>=8", "llm-routing[agent,mcp,code]"]

# Everything except the API SDK, which is the only extra that can spend money.
all = ["llm-routing[agent,mcp,code]"]

[project.scripts]
llm-router = "router_agent.cli:main"
llm-router-mcp = "router_agent.mcp_server:main"

[project.urls]
Homepage = "https://github.com/asen/llm-routing-comparison"

[tool.setuptools]
# Two packages, one arrow: `router_agent` imports `llm_routing`, never the
# reverse, and CI has a job whose only purpose is to keep it that way.
#
# `llm_routing` was a flat set of modules at the repository root until
# 11 August 2026. Each is still runnable on its own and still reads top to
# bottom - `python -m llm_routing.run_eval` - and importantly that still needs
# no install and no PYTHONPATH, which is what the bare-interpreter CI job
# checks.
packages = ["llm_routing", "router_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mock mode is the default for tests - deterministic, offline, free - and it is
# set in tests/conftest.py rather than here, because `models` reads
# ROUTER_MODE at import time and conftest runs before the first import.
filterwarnings = ["ignore::DeprecationWarning"]
