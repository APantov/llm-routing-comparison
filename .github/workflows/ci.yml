name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# No API keys anywhere in this file, and that is a deliberate property rather
# than an omission. Nothing below can reach a provider: replay - the default
# mode - refuses to touch the network, real mode has no key to use, and mock
# mode fabricates. CI cannot spend money, cannot leak a key, and cannot be made
# to by a pull request from a fork.
#
# ROUTER_MODE IS DELIBERATELY NOT SET HERE, AND IT USED TO BE `mock`.
#
# A workflow-level env var beats `os.environ.setdefault`, which is how the
# scripts below ask for the mode they need. `scripts/demo.py` asks for replay
# that way, so the global `mock` overrode it and the step named "the three
# routing scenarios replay from committed data" was running against the
# SIMULATOR - in which a cache miss is impossible, so the guard it existed to be
# could never fire.
#
# Now each context chooses: `tests/conftest.py` sets mock (the test suite's
# stand-in model), `scripts/check_core_unchanged.py` sets mock explicitly
# (it fingerprints the mock), and everything else gets the default, which is
# replay. Jobs that exercise the default are the ones proving a fresh clone
# works.

jobs:
  research-core:
    name: "research core (bare interpreter, no deps)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Nothing is installed on purpose. The core claim of the research half is
      # that it reproduces on a bare interpreter with no network and no key; a
      # CI job that pip-installs first would never notice that breaking.
      - name: numpy only (the MBPP+ graders need it)
        run: python -m pip install numpy

      - name: Build the task set
        run: python -m llm_routing.build_taskset

      # data/README.md claims the committed task set rebuilds byte for byte on
      # any platform, and every published number is joined against that file.
      # An unenforced reproducibility claim is a claim that quietly stops being
      # true, so this is the enforcement.
      - name: The task set rebuilds byte-identically
        run: git diff --exit-code -- data/taskset.jsonl

      - name: Regression gate
        # Exits non-zero if a grader is broken OR too lax. This is the gate
        # that failed to catch a real grader bug by only testing
        # grade(GT, GT); it now checks equivalent formattings and near-misses.
        run: python -m llm_routing.sanity_check

      - name: Splits are deterministic
        run: python -m llm_routing.splits

      # The analysis pipeline refuses to derive a published artefact from
      # fabricated responses (llm_routing.models.require_measured_mode). That
      # is the guard that replaced a banner reading "SIMULATED", and a guard
      # nobody checks is how the banner got trusted in the first place.
      #
      # Each command must fail, AND fail for the stated reason. A non-zero exit
      # alone would be satisfied by any of the other guards these modules carry
      # - guard_regression refuses a two-task run over a committed full one, so
      # an exit-code-only check would pass without the refusal ever running.
      - name: A mock run cannot produce a result
        run: |
          set -o pipefail
          check() {
            if "$@" > out.txt 2>&1; then
              echo "EXPECTED A REFUSAL, GOT SUCCESS: $*"; cat out.txt; exit 1
            fi
            grep -q "REFUSING TO RUN" out.txt || {
              echo "failed, but not by refusing: $*"; cat out.txt; exit 1
            }
          }
          # `env` rather than a bare VAR=x prefix: an assignment in front of a
          # SHELL FUNCTION leaks into the shell afterwards, so the fallback
          # flag on the last line would still be set for anything following.
          check env ROUTER_MODE=mock python -m llm_routing.run_eval --limit 2 --out /tmp/r.jsonl
          check env ROUTER_MODE=mock python -m llm_routing.frontier --out /tmp/f.jsonl
          check env ROUTER_MODE=mock python -m llm_routing.sweep_degraded --out /tmp/s.jsonl
          check env ROUTER_MODE=mock python -m llm_routing.routable --ladders wide
          check env ROUTER_MODE=replay ROUTER_REPLAY_FALLBACK=1 \
            python -m llm_routing.run_eval --limit 2 --out /tmp/r.jsonl
          rm -f out.txt

  research-tests:
    name: "research core unit tests (no agent stack installed)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # pytest and numpy ONLY. Deliberately not `.[dev]`: the architecture
      # claims the research core does not depend on the product, and a job that
      # installed langgraph and mcp could not tell whether that stayed true.
      # If tests/test_experiment.py ever imports router_agent, this job fails
      # and the agent-layer job below would not have noticed.
      - name: pytest and numpy only
        run: python -m pip install "pytest>=8" "numpy>=2.0"

      - name: Build the task set
        run: python -m llm_routing.build_taskset

      - name: Unit tests for the research core
        run: python -m pytest tests/test_experiment.py -v

  agent-layer:
    name: "agent layer (langgraph + mcp)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]" anyio

      - name: Build the task set
        run: python -m llm_routing.build_taskset

      - name: Tests
        run: python -m pytest tests/ -v

      - name: The mock change cannot move a benchmark number
        # Guards the one edit the agent layer made to the research core: a
        # `general` domain and a live-query branch in the mock. Both are
        # unreachable from build_taskset output, and this proves it by
        # fingerprinting every mock response the task set can produce and
        # comparing against tests/frozen_mock_fingerprints.json.
        #
        # The baseline is a committed file rather than `HEAD` on purpose. A
        # fresh checkout makes the working tree identical to HEAD, so the old
        # default compared the file against itself and could never fail here.
        run: python scripts/check_core_unchanged.py

  demo:
    name: "demo runs with no API key"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[agent]" numpy
      - run: python -m llm_routing.build_taskset

      # The property worth protecting: someone who clones this repository with
      # no account, no key and no money can watch the router escalate over
      # genuine model output, because the responses are committed.
      - name: Replay demo, math
        run: python -m router_agent.cli --demo --quiet
      - name: Replay demo, code
        run: python -m router_agent.cli --demo --domain code --quiet

      # The three canonical traces. Fails if any scenario misses the cache,
      # which is how a prompt change that silently invalidates the paid-for
      # responses gets caught.
      - name: The three routing scenarios replay from committed data
        run: python scripts/demo.py
      - name: Cost estimation is free
        run: python -m router_agent.cli --estimate "What is 17 times 23?"
      - name: Findings load from the committed data
        run: python -m router_agent.cli --findings

  mcp-server:
    name: "MCP server starts, registers and keeps stdout clean"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[agent,mcp]" numpy
      - run: python -m llm_routing.build_taskset
      - name: Registers in-process, then answers over real stdio
        run: python scripts/check_mcp_server.py

      # The walkthrough is the entry point most readers meet the server
      # through, and it is the only thing that exercises route_query and
      # resume_routing against a live client session over two server
      # processes. It asserts its own pauses, so a cache miss or a broken
      # approval loop fails the job rather than printing a shorter demo.
      - name: The MCP walkthrough replays from committed data
        run: python scripts/demo_mcp.py
      - name: Listing renders every description whole
        run: python scripts/mcp_call.py --list
